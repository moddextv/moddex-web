# production stack
#
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d
#
# assumes a reverse proxy terminates TLS and forwards to app:4999 on the `web`
# network. the app publishes no host port itself.
#
# rollback: set IMAGE_TAG to a previous sha in .env, then pull && up -d again.
#
# ONE SERVICE. The `db` and `backup` services this file used to declare were
# removed at the phase 2 cutover: moddex-api owns the database, its volume and
# the nightly dump, and this app reaches it over http like everything else.
# Re-adding a database here would put the estate back to two copies of the same
# data diverging quietly, which is the thing the split exists to prevent.

name: moddex

services:
  app:
    image: ${IMAGE:-ghcr.io/moddextv/moddex-web}:${IMAGE_TAG:-latest}
    env_file: .env
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4999/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # `web` only. there is no internal network any more because there is
    # nothing on this host for it to reach — api.moddex.tv is a public url.
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    external: true
