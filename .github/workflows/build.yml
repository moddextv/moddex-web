name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# One build per branch at a time. Without this, two pushes in quick succession
# run two full multi-arch builds at once that then fight over the same buildx
# cache, and both come out slower than either would alone — measured here at
# 51 min against a 44 min baseline. The older run is superseded by definition.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # deliberately its own job rather than a step in `check`: it is the cheapest
  # check there is, and it reports in its own right instead of hiding behind a
  # type error. Both gate the build, so a stray tab costs twenty seconds here
  # rather than the full per-architecture image build.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  # ---------------------------------------------------------------------------
  # One job per architecture, each on a runner of that architecture, so neither
  # is emulated. This replaces a single job that built both under qemu: the
  # arm64 half of a `next build` took ~42 min emulated against ~5 min native,
  # and it dominated the whole pipeline.
  #
  # Neither job tags anything. Each pushes an untagged image and reports its
  # digest; `merge` assembles those digests into one multi-arch tag. Tagging in
  # both jobs would mean the second to finish silently overwrites the first,
  # which is how you end up with a single-arch `latest` that pulls fine and then
  # refuses to run on the aarch64 host.
  # ---------------------------------------------------------------------------
  build:
    if: github.event_name == 'push'
    needs: [format, check]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      # one architecture failing should not hide whether the other works
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Name this platform for artifact paths
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - uses: actions/checkout@v4

      # no setup-qemu-action: the whole point is that neither build is emulated
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # labels only — tags are the merge job's business
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # scoped per platform: one shared scope means each build evicts the
          # other's layers every run and neither ever gets a warm cache
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          build-args: |
            NEXT_PUBLIC_PUBLISHABLE_SECRET_KEY=${{ secrets.NEXT_PUBLIC_PUBLISHABLE_SECRET_KEY }}

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Assemble the per-architecture digests into one tagged manifest list. This is
  # the only job that writes a tag, so `latest` either describes both
  # architectures or is not updated at all.
  # ---------------------------------------------------------------------------
  merge:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Create the manifest list and push it
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      # fails the run if either architecture is missing, rather than leaving a
      # half-published tag to be discovered on the server
      - name: Verify both architectures are present
        run: |
          docker buildx imagetools inspect '${{ env.IMAGE }}:${{ steps.meta.outputs.version }}' --raw \
            | jq -e '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort == ["linux/amd64","linux/arm64"]' \
            || { echo "::error::manifest is missing an architecture"; exit 1; }
          docker buildx imagetools inspect '${{ env.IMAGE }}:${{ steps.meta.outputs.version }}'
