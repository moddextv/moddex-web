<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>forsen | moddex</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/v2.css">
</head>

<!-- v2 / the first paint of a channel page.
     Everything already known is already drawn: the tabs, the role headings and
     their badges, the panel structure. Only the values are blank, so nothing
     shifts when the response lands.

     The founders panel carries the per-list failure. One list failing does not
     take the page down, and the message names which list and what to do. -->
<body data-nav="channel" data-scope="channel" data-auth="out" class="font-sans text-base">

<main id="main" class="flex-1 min-w-0" aria-busy="true">

  <section class="px-4 sm:px-6 pt-5">
    <div class="flex flex-wrap items-start gap-4">
      <span class="skeleton w-[70px] h-[70px] rounded-pill shrink-0"></span>

      <div class="min-w-0 flex-1">
        <span class="skeleton block h-6 w-44 mb-2"></span>
        <span class="skeleton block h-3.5 w-72 max-w-full mb-3"></span>
        <span class="skeleton block h-3.5 w-full max-w-md mb-1.5"></span>
        <span class="skeleton block h-3.5 w-2/3 max-w-sm"></span>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <span class="skeleton h-[30px] w-[132px]"></span>
        <span class="skeleton h-[30px] w-[30px]"></span>
        <span class="skeleton h-[30px] w-[30px]"></span>
      </div>
    </div>

    <nav class="tabs mt-5" aria-label="Views of this account">
      <a href="channel-detail.html" class="tab" aria-current="page">
        <span class="w-2.5 h-2.5 border-2 border-b-0 border-r-0 border-mod" aria-hidden="true"></span>
        As a channel
      </a>
      <a href="user-detail.html" class="tab">
        <span class="w-2.5 h-2.5 border-2 border-t-0 border-l-0 border-primary-500" aria-hidden="true"></span>
        As a person
      </a>
    </nav>
  </section>

  <section class="px-4 sm:px-6 py-5 grid gap-4 lg:grid-cols-12">

    <div class="card lg:col-span-5 pb-2">
      <div class="role-head border-b border-primary-700">
        <span class="chat-badge" style="background:#4ADE80" aria-hidden="true">
          <svg width="11" height="11" viewBox="0 0 32 32" fill="#0B0B0C"><path d="M4 4 H18 V10 H10 V18 H4 Z"/></svg>
        </span>
        <span class="text-mod">Moderators</span>
        <span class="ml-auto text-meta text-primary-400 font-normal">reading from twitch</span>
      </div>
      <div class="p-1.5">
        <span class="chatter"><span class="skeleton w-[18px] h-[18px]"></span><span class="skeleton w-[26px] h-[26px] rounded-pill"></span><span class="skeleton h-3.5 w-24"></span><span class="skeleton h-3 w-[68px] ml-auto"></span></span>
        <span class="chatter"><span class="skeleton w-[18px] h-[18px]"></span><span class="skeleton w-[26px] h-[26px] rounded-pill"></span><span class="skeleton h-3.5 w-32"></span><span class="skeleton h-3 w-[68px] ml-auto"></span></span>
        <span class="chatter"><span class="skeleton w-[18px] h-[18px]"></span><span class="skeleton w-[26px] h-[26px] rounded-pill"></span><span class="skeleton h-3.5 w-20"></span><span class="skeleton h-3 w-[68px] ml-auto"></span></span>
        <span class="chatter"><span class="skeleton w-[18px] h-[18px]"></span><span class="skeleton w-[26px] h-[26px] rounded-pill"></span><span class="skeleton h-3.5 w-28"></span><span class="skeleton h-3 w-[68px] ml-auto"></span></span>
        <span class="chatter"><span class="skeleton w-[18px] h-[18px]"></span><span class="skeleton w-[26px] h-[26px] rounded-pill"></span><span class="skeleton h-3.5 w-24"></span><span class="skeleton h-3 w-[68px] ml-auto"></span></span>
        <span class="chatter"><span class="skeleton w-[18px] h-[18px]"></span><span class="skeleton w-[26px] h-[26px] rounded-pill"></span><span class="skeleton h-3.5 w-36"></span><span class="skeleton h-3 w-[68px] ml-auto"></span></span>
        <span class="chatter"><span class="skeleton w-[18px] h-[18px]"></span><span class="skeleton w-[26px] h-[26px] rounded-pill"></span><span class="skeleton h-3.5 w-20"></span><span class="skeleton h-3 w-[68px] ml-auto"></span></span>
      </div>
    </div>

    <div class="card lg:col-span-4 pb-2">
      <div class="role-head border-b border-primary-700">
        <span class="chat-badge" style="background:#F472B6" aria-hidden="true">
          <svg width="11" height="11" viewBox="0 0 32 32" fill="#0B0B0C"><path d="M28 28 H14 V22 H22 V14 H28 Z"/></svg>
        </span>
        <span class="text-vip">VIPs</span>
        <span class="ml-auto text-meta text-primary-400 font-normal">reading from twitch</span>
      </div>
      <div class="p-1.5">
        <span class="chatter"><span class="skeleton w-[18px] h-[18px]"></span><span class="skeleton w-[26px] h-[26px] rounded-pill"></span><span class="skeleton h-3.5 w-24"></span><span class="skeleton h-3 w-[68px] ml-auto"></span></span>
        <span class="chatter"><span class="skeleton w-[18px] h-[18px]"></span><span class="skeleton w-[26px] h-[26px] rounded-pill"></span><span class="skeleton h-3.5 w-32"></span><span class="skeleton h-3 w-[68px] ml-auto"></span></span>
        <span class="chatter"><span class="skeleton w-[18px] h-[18px]"></span><span class="skeleton w-[26px] h-[26px] rounded-pill"></span><span class="skeleton h-3.5 w-20"></span><span class="skeleton h-3 w-[68px] ml-auto"></span></span>
      </div>
    </div>

    <!-- per-list failure -->
    <div class="card lg:col-span-3 pb-2">
      <div class="role-head border-b border-primary-700">
        <span class="chat-badge" style="background:#FBBF24" aria-hidden="true">
          <svg width="11" height="11" viewBox="0 0 32 32" fill="#0B0B0C"><path d="M4 28 H18 V22 H10 V14 H4 Z"/></svg>
        </span>
        <span class="text-founder">Founders</span>
        <span class="ml-auto text-meta text-vip font-normal">failed</span>
      </div>
      <div class="p-4">
        <p class="text-ui text-primary-300 leading-relaxed mb-1.5">
          Twitch returned an error for this query.
        </p>
        <p class="text-meta text-primary-400 leading-relaxed mb-3">
          The other lists on this page are unaffected.
        </p>
        <button type="button" class="btn btn-alt">Try this list again</button>
      </div>
    </div>
  </section>
</main>

<script src="assets/chrome.js"></script>
</body>
</html>
