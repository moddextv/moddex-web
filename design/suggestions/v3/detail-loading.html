<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>forsen | moddex</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/v3.css">
</head>

<!-- v3 / the first paint of a profile.
     Everything already known is already drawn: the tabs, the section headings
     and their corners, the column labels. Only the values are blank, so nothing
     shifts when the response lands.

     The founders panel carries the per-list failure. One list failing does not
     take the page down, and the message names which list and what to do. -->
<body data-scope="channel" data-auth="out" class="font-sans text-base min-h-screen">

<main id="main" aria-busy="true">
  <div class="mx-auto w-full max-w-page px-6 sm:px-8">

    <section class="pt-10 pb-8">
      <div class="flex flex-wrap items-start gap-6">
        <span class="skeleton w-[88px] h-[88px] rounded-pill"></span>

        <div class="min-w-0 flex-1">
          <span class="skeleton block h-7 w-44 mb-3"></span>
          <span class="skeleton block h-4 w-full max-w-md mb-2"></span>
          <span class="skeleton block h-4 w-2/3 max-w-sm mb-4"></span>
          <span class="skeleton block h-3.5 w-80 max-w-full"></span>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <span class="skeleton h-10 w-[150px]"></span>
          <span class="skeleton h-10 w-10"></span>
          <span class="skeleton h-10 w-10"></span>
        </div>
      </div>

      <nav class="tabs mt-8" aria-label="Which direction to read this account">
        <a href="channel-detail.html" class="tab tab-mod" aria-current="page">
          <span class="corner corner-tl text-mod" aria-hidden="true"></span>
          Holds roles in this channel
        </a>
        <a href="user-detail.html" class="tab tab-vip">
          <span class="corner corner-br text-primary-600" aria-hidden="true"></span>
          Roles forsen holds elsewhere
        </a>
      </nav>
    </section>

    <section class="grid gap-6 lg:grid-cols-2 pb-6">

      <div class="panel-flush">
        <div class="flex items-center gap-3 flex-wrap px-4 pb-5">
          <span class="corner corner-tl text-mod" aria-hidden="true"></span>
          <h2 class="text-h2">Moderators</h2>
          <span class="ml-auto text-ui text-primary-400">reading from twitch</span>
        </div>

        <div class="rows">
          <div class="row-head cols-people">
            <span>Account</span>
            <span class="text-right">Granted</span>
            <span class="text-right">Followers</span>
          </div>

          <div class="row cols-people">
            <span class="flex items-center gap-3.5 min-w-0">
              <span class="skeleton w-9 h-9 rounded-pill"></span>
              <span class="min-w-0"><span class="skeleton block h-4 w-24 mb-1.5"></span><span class="skeleton block h-3 w-20"></span></span>
            </span>
            <span class="skeleton h-3.5 w-16 justify-self-end"></span>
            <span class="skeleton h-3.5 w-14 justify-self-end"></span>
          </div>
          <div class="row cols-people">
            <span class="flex items-center gap-3.5 min-w-0">
              <span class="skeleton w-9 h-9 rounded-pill"></span>
              <span class="min-w-0"><span class="skeleton block h-4 w-32 mb-1.5"></span><span class="skeleton block h-3 w-24"></span></span>
            </span>
            <span class="skeleton h-3.5 w-16 justify-self-end"></span>
            <span class="skeleton h-3.5 w-12 justify-self-end"></span>
          </div>
          <div class="row cols-people">
            <span class="flex items-center gap-3.5 min-w-0">
              <span class="skeleton w-9 h-9 rounded-pill"></span>
              <span class="min-w-0"><span class="skeleton block h-4 w-20 mb-1.5"></span><span class="skeleton block h-3 w-20"></span></span>
            </span>
            <span class="skeleton h-3.5 w-16 justify-self-end"></span>
            <span class="skeleton h-3.5 w-16 justify-self-end"></span>
          </div>
          <div class="row cols-people">
            <span class="flex items-center gap-3.5 min-w-0">
              <span class="skeleton w-9 h-9 rounded-pill"></span>
              <span class="min-w-0"><span class="skeleton block h-4 w-28 mb-1.5"></span><span class="skeleton block h-3 w-16"></span></span>
            </span>
            <span class="skeleton h-3.5 w-16 justify-self-end"></span>
            <span class="skeleton h-3.5 w-12 justify-self-end"></span>
          </div>
          <div class="row cols-people">
            <span class="flex items-center gap-3.5 min-w-0">
              <span class="skeleton w-9 h-9 rounded-pill"></span>
              <span class="min-w-0"><span class="skeleton block h-4 w-36 mb-1.5"></span><span class="skeleton block h-3 w-24"></span></span>
            </span>
            <span class="skeleton h-3.5 w-16 justify-self-end"></span>
            <span class="skeleton h-3.5 w-14 justify-self-end"></span>
          </div>
          <div class="row cols-people">
            <span class="flex items-center gap-3.5 min-w-0">
              <span class="skeleton w-9 h-9 rounded-pill"></span>
              <span class="min-w-0"><span class="skeleton block h-4 w-24 mb-1.5"></span><span class="skeleton block h-3 w-20"></span></span>
            </span>
            <span class="skeleton h-3.5 w-16 justify-self-end"></span>
            <span class="skeleton h-3.5 w-16 justify-self-end"></span>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-6">
        <div class="panel-flush">
          <div class="flex items-center gap-3 flex-wrap px-4 pb-5">
            <span class="corner corner-br text-vip" aria-hidden="true"></span>
            <h2 class="text-h2">VIPs</h2>
            <span class="ml-auto text-ui text-primary-400">reading from twitch</span>
          </div>

          <div class="rows">
            <div class="row-head cols-people">
              <span>Account</span>
              <span class="text-right">Granted</span>
              <span class="text-right">Followers</span>
            </div>

            <div class="row cols-people">
              <span class="flex items-center gap-3.5 min-w-0">
                <span class="skeleton w-9 h-9 rounded-pill"></span>
                <span class="min-w-0"><span class="skeleton block h-4 w-24 mb-1.5"></span><span class="skeleton block h-3 w-20"></span></span>
              </span>
              <span class="skeleton h-3.5 w-16 justify-self-end"></span>
              <span class="skeleton h-3.5 w-14 justify-self-end"></span>
            </div>
            <div class="row cols-people">
              <span class="flex items-center gap-3.5 min-w-0">
                <span class="skeleton w-9 h-9 rounded-pill"></span>
                <span class="min-w-0"><span class="skeleton block h-4 w-32 mb-1.5"></span><span class="skeleton block h-3 w-16"></span></span>
              </span>
              <span class="skeleton h-3.5 w-16 justify-self-end"></span>
              <span class="skeleton h-3.5 w-10 justify-self-end"></span>
            </div>
          </div>
        </div>

        <!-- per-list failure: named list, plain cause, one action, and an
             explicit note that the rest of the page is intact -->
        <div class="panel">
          <div class="flex items-center gap-3 mb-4">
            <span class="corner corner-bl text-founder" aria-hidden="true"></span>
            <h2 class="text-h2">Founders</h2>
            <span class="text-ui text-vip ml-auto">could not be read</span>
          </div>
          <p class="text-read text-primary-300 max-w-prose mb-2">
            Twitch returned an error for this query.
          </p>
          <p class="text-ui text-primary-400 mb-5">
            The other lists on this page are unaffected.
          </p>
          <button type="button" class="btn btn-soft">Try this list again</button>
        </div>
      </div>
    </section>
  </div>
</main>

<script src="assets/chrome.js"></script>
</body>
</html>
