<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>channel forsen | moddex</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="stylesheet" href="assets/design.css">
</head>

<!-- UserProfileLoading + UserListLoading — the first paint of a detail page.
     both skeletons mirror the real geometry exactly (64px avatar, 72px rows,
     rail + avatar + two text lines) so nothing shifts when the data lands.
     these are the one place the design allows rounded corners: they are
     heroui's <Skeleton>, not our own surfaces. -->
<body class="min-h-screen overflow-y-scroll antialiased flex flex-col bg-primary-900 text-primary-100">

<header class="sticky top-0 z-40 border-b border-primary-700 bg-primary-900/85 backdrop-blur-md">
  <div class="mx-auto w-full max-w-5xl px-5 sm:px-8 flex items-center h-16 gap-8">
    <a href="home.html" class="flex items-center gap-3 shrink-0 text-primary-100 pressable" aria-label="moddex home">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="currentColor" role="img" aria-label="moddex" class="shrink-0">
        <path d="M4 4 H18 V10 H10 V18 H4 Z"/><path d="M28 28 H14 V22 H22 V14 H28 Z"/>
      </svg>
      <span class="font-cairo text-xl leading-none tracking-tight">moddex</span>
    </a>

    <nav class="hidden md:flex items-center gap-1" aria-label="Main">
      <a href="channel.html" aria-current="page" class="tick relative flex items-center gap-1 px-3 h-8 text-sm transition-colors duration-150 text-primary-100">channel</a>
      <a href="user.html" class="relative flex items-center gap-1 px-3 h-8 text-sm transition-colors duration-150 text-primary-400 hover:text-primary-200">user</a>
      <a href="donate.html" class="relative flex items-center gap-1 px-3 h-8 text-sm transition-colors duration-150 text-primary-400 hover:text-primary-200">donate</a>
      <a href="no-ui.html" class="relative flex items-center gap-1 px-3 h-8 text-sm transition-colors duration-150 text-primary-400 hover:text-primary-200">api</a>
    </nav>

    <div class="ml-auto hidden md:flex items-center">
      <a href="login.html" class="pressable inline-flex items-center gap-2 h-8 px-3 rounded-sm bg-twitch text-white text-sm font-medium hover:brightness-110">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M2.149 0l-1.612 4.119v16.836h5.731v3.045h3.224l3.045-3.045h4.657l6.269-6.269v-14.686h-21.314zm19.164 13.612l-3.582 3.582h-5.731l-3.045 3.045v-3.045h-4.836v-15.045h17.194v11.463zm-3.582-7.343v6.262h-2.149v-6.262h2.149zm-5.731 0v6.262h-2.149v-6.262h2.149z"/>
        </svg>
        login
      </a>
    </div>
  </div>
</header>

<main class="flex-grow">
  <div class="mx-auto w-full max-w-5xl px-5 sm:px-8 py-12 flex flex-col gap-10">

    <!-- ============================================= UserProfileLoading == -->
    <div class="flex flex-col gap-5">
      <div class="flex items-start gap-4">
        <div class="skeleton rounded-full w-16 h-16 shrink-0"></div>

        <div class="flex-1 min-w-0">
          <div class="skeleton h-8 w-56 rounded-lg mb-2"></div>
          <div class="skeleton h-5 w-24 rounded-md mb-3"></div>

          <div class="flex flex-row gap-1 mb-3">
            <div class="skeleton h-[22px] w-[22px] rounded-md"></div>
            <div class="skeleton h-[22px] w-[22px] rounded-md"></div>
          </div>

          <div class="skeleton h-4 w-72 max-w-full rounded-md mb-2"></div>
          <div class="skeleton h-3 w-40 rounded-md"></div>
        </div>
      </div>

      <div class="skeleton h-8 w-52 rounded-lg"></div>
    </div>

    <!-- ================================================ UserListLoading == -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-10">
      <section>
        <!-- the heading keeps its corner and its label while the rows load —
             only the count and the controls are withheld, because those are
             the parts that depend on the response -->
        <div class="flex items-center gap-3 h-8 mb-1">
          <span aria-hidden="true" class="w-3 h-3 border-2 border-b-0 border-r-0 border-mod"></span>
          <h2 class="text-sm uppercase tracking-wider text-mod">mods</h2>
        </div>

        <div class="border-t border-primary-700">
          <div class="flex items-center gap-3 h-[72px] px-2 border-b border-primary-800">
            <div class="skeleton w-[3px] h-9 rounded-full"></div>
            <div class="skeleton w-10 h-10 rounded-full shrink-0"></div>
            <div class="flex-1 flex flex-col gap-2">
              <div class="skeleton h-4 w-2/5 rounded"></div>
              <div class="skeleton h-3 w-1/4 rounded"></div>
            </div>
          </div>
          <div class="flex items-center gap-3 h-[72px] px-2 border-b border-primary-800">
            <div class="skeleton w-[3px] h-9 rounded-full"></div>
            <div class="skeleton w-10 h-10 rounded-full shrink-0"></div>
            <div class="flex-1 flex flex-col gap-2">
              <div class="skeleton h-4 w-2/5 rounded"></div>
              <div class="skeleton h-3 w-1/4 rounded"></div>
            </div>
          </div>
          <div class="flex items-center gap-3 h-[72px] px-2 border-b border-primary-800">
            <div class="skeleton w-[3px] h-9 rounded-full"></div>
            <div class="skeleton w-10 h-10 rounded-full shrink-0"></div>
            <div class="flex-1 flex flex-col gap-2">
              <div class="skeleton h-4 w-2/5 rounded"></div>
              <div class="skeleton h-3 w-1/4 rounded"></div>
            </div>
          </div>
        </div>
      </section>

      <section>
        <div class="flex items-center gap-3 h-8 mb-1">
          <span aria-hidden="true" class="w-3 h-3 border-2 border-t-0 border-l-0 border-vip"></span>
          <h2 class="text-sm uppercase tracking-wider text-vip">vips</h2>
        </div>

        <div class="border-t border-primary-700">
          <div class="flex items-center gap-3 h-[72px] px-2 border-b border-primary-800">
            <div class="skeleton w-[3px] h-9 rounded-full"></div>
            <div class="skeleton w-10 h-10 rounded-full shrink-0"></div>
            <div class="flex-1 flex flex-col gap-2">
              <div class="skeleton h-4 w-2/5 rounded"></div>
              <div class="skeleton h-3 w-1/4 rounded"></div>
            </div>
          </div>
          <div class="flex items-center gap-3 h-[72px] px-2 border-b border-primary-800">
            <div class="skeleton w-[3px] h-9 rounded-full"></div>
            <div class="skeleton w-10 h-10 rounded-full shrink-0"></div>
            <div class="flex-1 flex flex-col gap-2">
              <div class="skeleton h-4 w-2/5 rounded"></div>
              <div class="skeleton h-3 w-1/4 rounded"></div>
            </div>
          </div>
          <div class="flex items-center gap-3 h-[72px] px-2 border-b border-primary-800">
            <div class="skeleton w-[3px] h-9 rounded-full"></div>
            <div class="skeleton w-10 h-10 rounded-full shrink-0"></div>
            <div class="flex-1 flex flex-col gap-2">
              <div class="skeleton h-4 w-2/5 rounded"></div>
              <div class="skeleton h-3 w-1/4 rounded"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- the failure state of a single list. one list failing does not take
           the page down — the other columns keep their data. -->
      <section>
        <div class="flex items-center gap-3 h-8 mb-1">
          <span aria-hidden="true" class="w-3 h-3 border-2 border-t-0 border-r-0 border-founder"></span>
          <h2 class="text-sm uppercase tracking-wider text-founder">founders</h2>
        </div>
        <p class="py-3 text-red-400">could not load founders, please try again</p>
      </section>
    </div>
  </div>
</main>

<footer class="mt-auto border-t border-primary-700 py-5 text-sm text-primary-400">
  <div class="mx-auto w-full max-w-5xl px-5 sm:px-8 flex flex-col sm:flex-row gap-x-6 gap-y-2 sm:items-center">
    <span>&copy; 2026 moddex</span>
    <span class="text-primary-500">not affiliated with twitch interactive</span>
    <nav class="flex gap-4 sm:ml-auto" aria-label="Footer">
      <a class="hover:text-primary-200 transition-colors duration-150" href="tos.html">tos</a>
      <a class="hover:text-primary-200 transition-colors duration-150" href="no-ui.html">api</a>
      <a class="hover:text-primary-200 transition-colors duration-150" href="no-ui.html">status</a>
    </nav>
  </div>
</footer>

<script src="assets/pages.js"></script>
</body>
</html>
